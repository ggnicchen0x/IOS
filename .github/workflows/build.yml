name: Build iOS Tweak (.deb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # Clone patched iOS SDKs
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p $HOME/theos/sdks
          cp -r /tmp/theos-sdks/*.sdk $HOME/theos/sdks/

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 messages=yes

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFMAXLicense-deb
          path: packages/*.deb
